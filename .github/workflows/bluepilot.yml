name: bluepilot port checks

# Runs on the install branch and the test branch.
on:
  push:
    branches: [bp-lateral-upstream, bp-lateral-upstream-ci]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - name: setup
      run: ./setup.sh

    - name: BluePilot library safety tests (incl. pinion geometry table)
      if: always()
      run: source setup.sh && python -m unittest discover -s opendbc/bluepilot_lateral/safety/tests -t .

    - name: BluePilot library python tests
      if: always()
      run: source setup.sh && python -m unittest discover -s opendbc/bluepilot_lateral/tests -t .

    - name: upstream safety suite (all brands, coverage)
      if: always()
      run: ./opendbc/safety/tests/test.sh

    - name: upstream unit tests (car interfaces etc.)
      if: always()
      run: source setup.sh && unittest-parallel -j4

    - name: MISRA C:2012 (panda safety style rules)
      if: always()
      run: source setup.sh && opendbc/safety/tests/misra/test_misra.sh
